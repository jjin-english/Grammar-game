const f=full(r);if(t!="ox"||a==0)h+=`<br><span class="en" style="font-size:16px">${f}</span>`;
h+=`<br>${r[5]}`;if(!ok)h+=`<div class="rule">${R[q.g]}</div>`;
const box=el("div","card "+(ok?"ok":"no"),h);const sp=el("button","","🔊 문장 듣기");sp.onclick=()=>speak(f);
const nx=el("button","go",S.n+1<S.qs.length?"다음 문제 →":"결과 보기");nx.onclick=()=>{S.n++;S.n<S.qs.length?show():end()};
box.append(el("br"),sp," ",nx);fb.append(box);box.scrollIntoView({behavior:"smooth",block:"nearest"})};
if(t=="mc"){if(s)c.append(el("div","en",s.replace("___",'<span class="blank">＿＿＿</span>')));
const op=shuf(o.map((x,j)=>({x,ok:j==a})));op.forEach(p=>{const b=el("button","opt",p.x);b.onclick=()=>fin(p.ok,p.x);c.append(b)})}
else if(t=="ox"){c.append(el("div","en",s),el("div","sub","이 문장은 어법상 올바른가요?"));["O","X"].forEach((x,j)=>{const b=el("button","opt",x=="O"?"⭕ 올바르다":"❌ 틀렸다");b.onclick=()=>fin(j==a,x);c.append(b)})}
else if(t=="err"){c.append(el("div","sub","어법상 틀린 부분을 고르세요."));s.split("|").forEach((x,j)=>{const b=el("button","opt",x);b.onclick=()=>fin(j==a,x);c.append(b)})}
else if(t=="typ"){c.append(el("div","en",s.replace("___",'<span class="blank">＿＿＿</span>')));const i=el("input");i.type="text";i.autocomplete="off";i.autocapitalize="off";i.placeholder="정답 입력";
const go=()=>{if(S.lock||!i.value.trim())return;const v=norm(i.value);fin(a.some(x=>norm(x)==v),i.value.trim())};i.onkeydown=e=>{if(e.key=="Enter")go()};
const b=el("button","go","확인");b.onclick=go;c.append(i,el("br"),b)}
else{c.append(el("div","sub","단어를 눌러 순서대로 문장을 만드세요. (눌러서 빼기도 가능)"));const ab=el("div","ansbox"),bb=el("div");
const bank=shuf(s.split(" ").concat(o||[]).map(w=>({w,u:0}))),pk=[];
const draw=()=>{ab.innerHTML="";bb.innerHTML="";pk.forEach(p=>{const x=el("span","chip sel",p.w);x.onclick=()=>{if(S.lock)return;p.u=0;pk.splice(pk.indexOf(p),1);draw()};ab.append(x)});
bank.forEach(p=>{if(p.u)return;const x=el("span","chip",p.w);x.onclick=()=>{if(S.lock)return;p.u=1;pk.push(p);draw()};bb.append(x)})};draw();
const b=el("button","go","확인");b.onclick=()=>{if(S.lock||!pk.length)return;const v=pk.map(p=>p.w).join(" ");fin(v==s,v)};c.append(ab,bb,b)}}
function end(){app.innerHTML="";const n=S.res.filter(r=>r.ok).length,tot=S.res.length,d=PART[S.k].d;
if(tot==d.length){try{if(n>(+best(S.k)||0))localStorage.setItem("aipt_"+S.k,n)}catch(e){}}
app.append(el("h1","",PART[S.k].n+" 결과"),el("div","sc",`${n} / ${tot}`),el("div","sub",n==tot?"🎉 완벽해요!":n>=tot*.8?"👍 아주 잘했어요!":"틀린 문제를 복습하고 다시 도전해 봐요!"));
const w=S.res.filter(r=>!r.ok);
w.forEach(x=>{const r=x.q.r;const bx=el("div","card no",`<b>${x.q.i+1}번 (${x.q.lv})</b> ${r[1]}<br><span class="en" style="font-size:16px">${r[2]||""}</span>내 답: ${x.u}<br>정답: <b>${corr(r)}</b><br>${r[5]}<div class="rule">${R[x.q.g]}</div>`);app.append(bx)});
if(w.length){const b=el("button","go","틀린 문제만 다시 풀기 ("+w.length+")");b.onclick=()=>start(S.k,w.map(x=>x.q.i));app.append(b)}
const b2=el("button","","처음부터 다시"),b3=el("button","","홈으로");b2.onclick=()=>start(S.k);b3.onclick=home;app.append(el("br"),b2," ",b3)}
home();
</script></body></html>
