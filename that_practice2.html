SEC[5].tip+='<br>👉 that 뒤가 <b>불완전</b>해요. (주어가 빠져 있어요)';
function cks(text,roles,sn,sx){
 const CL=CLAUSE[sn]?CLAUSE[sn][sx]:-1;
 const tag=[2,3,6].includes(sn)?'<span class="tg full">✔ 꽉 찬 문장</span>':'<span class="tg hole">✖ '+(sn==4?'목적어':'주어')+' 빠짐</span>';
 return '<div class="cks">'+text.split("|").map((t,x)=>{const k=roles[x];
  const th="apnrwd".includes(k);
  return (x?'<span class="sl">/</span>':'')+`<span class="ck"><span class="tx ${th?'hl':''}">${t}</span><span class="bd ${bc(k)}">${LB[k]}</span>${x===CL?tag:''}</span>`}).join("")+'</div>';
}
let n,S,j,i,ok,wrong;
function menu(){
 $.innerHTML='<h1>that 문장구조 연습</h1><p class="sub">한 단계에 10문제! 1~5번은 배우기, 6~10번은 스스로 풀기예요.</p>'+
 SEC.map((s,x)=>`<button class="btn" onclick="intro(${x})">${s.t}<small>배우기 5 + 풀기 5</small></button>`).join("");
}
function intro(a){
 n=a;S=SEC[a];
 const lg=Object.keys(LB).map(k=>`<span class="bd ${bc(k)}">${LB[k]}${HELP[k]?" ("+HELP[k]+")":""}</span>`).join("");
 $.innerHTML=`<h1>${S.t}</h1><div class="tip">${S.tip}</div><p class="sub">문장을 / 로 나눠서 각 덩어리의 역할을 보여줘요.</p><div class="lg">${lg}</div><button class="btn go" onclick="learn(0)">배우기 시작 (1~5번)</button><button class="btn" onclick="menu()">← 단계 선택</button>`;
}
function learn(x){
 if(x>=5){Q=S.q.slice();i=0;ok=0;wrong=[];return ask();}
 j=x;const d=S.w[x];
 $.innerHTML=`<div class="top"><span>${S.t}</span><span>${x+1} / 10</span></div><div class="bar"><i style="width:${x*10}%"></i></div>
 ${cks(d[0],ROLE[n][x],n,x)}<div class="ko">${d[1]}</div><div class="ex">💡 ${d[2]}</div>
 <button class="btn go" onclick="learn(${x+1})">${x==4?"이제 스스로 풀어봐요!":"다음"}</button>`;
}
function ask(){
 if(i>=Q.length)return end();
 const q=Q[i];
 $.innerHTML=`<div class="top"><span>${S.t}</span><span>${i+6} / 10</span></div><div class="bar"><i style="width:${(i+5)*10}%"></i></div>
 <div class="en">${q[0].replace(/\bthat\b/i,m=>"<mark>"+m+"</mark>")}</div><div class="ko">${q[1]}</div>
 <p class="sub">노란색 that의 쓰임은?</p>${S.k.split("").map(k=>`<button class="btn ch" data-k="${k}">${CH[k]}</button>`).join("")}<div id="fb"></div>`;
 document.querySelectorAll(".ch").forEach(b=>b.onclick=()=>pick(b,q));
}
function pick(b,q){
 const r=b.dataset.k===q[2];
 document.querySelectorAll(".ch").forEach(x=>{x.disabled=true;if(x.dataset.k===q[2])x.classList.add("ok")});
 if(r)ok++;else{b.classList.add("no");wrong.push(q)}
 document.getElementById("fb").innerHTML=`<div class="fb">${r?"⭕ 정답!":"❌ 정답은 "+CH[q[2]]}<br>💡 ${q[3]}</div><button class="btn go" onclick="i++;ask()">${i>=Q.length-1?"결과 보기":"다음"}</button>`;
}
function end(){
 const tot=Q.length;
 $.innerHTML=`<h1>${ok} / ${tot} 정답</h1><p class="sub">${wrong.length?"틀린 문제를 다시 풀어봐요!":"완벽해요! 다음 단계로 가볼까요?"}</p>`+
 wrong.map(q=>`<div class="rv">${q[0]}<br>${q[1]}<br>→ ${CH[q[2]]}</div>`).join("")+
 (wrong.length?`<button class="btn go" id="rw">틀린 문제 다시 풀기</button>`:"")+
 (n<SEC.length-1?`<button class="btn" onclick="intro(${n+1})">다음 단계 →</button>`:"")+
 `<button class="btn" onclick="learn(0)">배우기부터 다시</button><button class="btn" onclick="menu()">단계 선택</button>`;
 const rw=document.getElementById("rw");
 if(rw){const w=wrong.slice();rw.onclick=()=>{Q=w;i=0;ok=0;wrong=[];ask()}}
}
menu();
</script></body></html>
