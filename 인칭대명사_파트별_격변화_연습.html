<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>인칭대명사 격변화 완전정복</title>
<style>
  :root{
    --bg:#1b1f30;
    --bg2:#242a42;
    --card:#2b3150;
    --ink:#f2f0ea;
    --ink-dim:#a9aec7;
    --sub:#7fd8c4;
    --pos:#f2b880;
    --obj:#c6a4f7;
    --poss:#f4a3b6;
    --amber:#f2b880;
    --good:#7fd8a0;
    --bad:#f28080;
    --study:#8ea3ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:20px 18px 32px;}
  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}

  .eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:10px;}
  h1{font-size:26px;line-height:1.3;margin:0 0 12px;font-weight:800;}
  .lead{color:var(--ink-dim);font-size:15px;line-height:1.6;margin-bottom:20px;}

  .btn{border:none;border-radius:16px;padding:16px 20px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-primary{background:var(--amber);color:#231506;}
  .btn-primary:active{transform:scale(.98);}
  .btn-primary:disabled{opacity:.35;}
  .btn-ghost{background:transparent;border:1px solid #3d4468;color:var(--ink);}
  .btn:disabled{opacity:.4;}
  .spacer{flex:1;}

  .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .icon-btn{background:none;border:none;color:var(--ink-dim);font-size:15px;font-weight:700;cursor:pointer;padding:4px 0;}

  .top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .progress-text{font-size:13px;color:var(--ink-dim);font-weight:600;}
  .score-text{font-size:13px;color:var(--sub);font-weight:700;}
  .progress-track{height:5px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-bottom:22px;}
  .progress-fill{height:100%;background:var(--sub);border-radius:99px;transition:width .25s ease;}

  .card{background:var(--card);border-radius:24px;padding:32px 22px;margin-bottom:18px;}
  .sent-en{font-size:22px;font-weight:700;line-height:1.5;margin-bottom:14px;}
  .blank-slot{display:inline-block;min-width:64px;border-bottom:2px solid var(--ink-dim);padding:0 4px;text-align:center;}
  .sent-ko{font-size:15px;color:var(--ink-dim);line-height:1.5;}

  .role-chip{display:inline-block;font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px;margin-bottom:14px;background:var(--bg2);visibility:hidden;}
  .role-chip.c-sub{color:var(--sub);}
  .role-chip.c-pos{color:var(--pos);}
  .role-chip.c-obj{color:var(--obj);}
  .role-chip.c-poss{color:var(--poss);}
  .role-chip.show{visibility:visible;}

  .input-row{display:flex;gap:10px;margin-bottom:14px;}
  .ans-input{
    flex:1;background:var(--bg2);border:2px solid #3d4468;border-radius:14px;
    padding:14px 16px;font-size:18px;color:var(--ink);font-family:inherit;
  }
  .ans-input:focus{outline:none;border-color:var(--amber);}
  .ans-input.correct{border-color:var(--good);}
  .ans-input.wrong{border-color:var(--bad);}

  .options-container{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .opt-btn{background:var(--bg2);border:2px solid #3d4468;border-radius:14px;padding:14px 16px;font-size:17px;font-weight:700;color:var(--ink);text-align:left;cursor:pointer;font-family:inherit;}
  .opt-btn:active{transform:scale(.99);}
  .opt-btn.correct{border-color:var(--good);color:var(--good);background:rgba(127,216,160,0.08);}
  .opt-btn.wrong{border-color:var(--bad);color:var(--bad);background:rgba(242,128,128,0.08);}
  .opt-btn.disabled{pointer-events:none;}

  .feedback{font-size:14px;font-weight:700;margin-bottom:14px;min-height:20px;}
  .feedback.good{color:var(--good);}
  .feedback.bad{color:var(--bad);}

  /* home list */
  .home-list{flex:1;overflow-y:auto;}
  .section-label{font-size:12px;color:var(--ink-dim);font-weight:700;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.08em;}
  .section-label:first-child{margin-top:0;}
  .part-row{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:16px;padding:15px 16px;margin-bottom:10px;cursor:pointer;}
  .part-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .part-row.c-sub .part-dot{background:var(--sub);}
  .part-row.c-pos .part-dot{background:var(--pos);}
  .part-row.c-obj .part-dot{background:var(--obj);}
  .part-row.c-poss .part-dot{background:var(--poss);}
  .part-row.c-spell .part-dot{background:var(--amber);}
  .part-row.c-study .part-dot{background:var(--study);}
  .part-row.c-review .part-dot{background:var(--bad);}
  .part-body{flex:1;}
  .part-title{font-weight:700;font-size:15px;}
  .part-sub{font-size:12px;color:var(--ink-dim);margin-top:2px;}
  .part-badge{font-size:13px;font-weight:700;color:var(--ink-dim);flex-shrink:0;white-space:nowrap;}
  .part-badge.done{color:var(--good);}
  .part-badge.warn{color:var(--bad);}

  /* study */
  .study-list{flex:1;overflow-y:auto;margin-bottom:16px;}
  .study-card{background:var(--bg2);border-radius:16px;padding:16px;margin-bottom:10px;}
  .study-name{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
  .study-name .play-icon{font-size:13px;color:var(--amber);}
  .study-forms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .sf-cell{text-align:center;background:var(--card);border-radius:10px;padding:8px 4px;border:2px solid transparent;transition:all .15s ease;}
  .sf-cell.playing{border-color:var(--amber);transform:scale(1.06);}
  .sf-cell .tag{font-size:9px;color:var(--ink-dim);display:block;margin-bottom:3px;}
  .sf-cell .w{font-weight:800;font-size:13px;}
  .sf-cell .k{font-size:10px;color:var(--ink-dim);margin-top:2px;}
  .sf-cell.c-sub .w{color:var(--sub);}
  .sf-cell.c-pos .w{color:var(--pos);}
  .sf-cell.c-obj .w{color:var(--obj);}
  .sf-cell.c-poss .w{color:var(--poss);}

  /* results */
  .result-score{font-size:52px;font-weight:800;text-align:center;margin:10px 0 4px;}
  .result-sub{text-align:center;color:var(--ink-dim);font-size:14px;margin-bottom:26px;}
  .wrong-list{flex:1;overflow-y:auto;margin-bottom:16px;}
  .wrong-item{background:var(--bg2);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
  .wrong-item .role-tag{font-size:11px;font-weight:700;margin-bottom:6px;display:inline-block;}
  .wrong-item.c-sub .role-tag{color:var(--sub);}
  .wrong-item.c-pos .role-tag{color:var(--pos);}
  .wrong-item.c-obj .role-tag{color:var(--obj);}
  .wrong-item.c-poss .role-tag{color:var(--poss);}
  .wrong-item .sent{font-size:15px;font-weight:700;margin-bottom:3px;}
  .wrong-item .sent b{color:var(--good);}
  .wrong-item .sent-ko{font-size:13px;color:var(--ink-dim);}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}
  .empty-note{text-align:center;color:var(--ink-dim);font-size:14px;margin:30px 0;}
</style>
</head>
<body>
<div id="app">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="eyebrow">Case in Context</div>

    <div class="home-list" id="home-list"></div>

    <div class="top-bar">
      <button class="icon-btn" onclick="exitToHome()">← 홈</button>
      <span class="score-text" id="score-text">맞음 0</span>

    <div class="top-row">

    </div>
    <div class="feedback" id="feedback"></div>

    <div class="spacer"></div>
    <button class="btn btn-primary" id="action-btn" onclick="handleAction()">확인</button>
  </div>

  <!-- RESULTS -->
  <div class="screen" id="screen-results">
    <div class="eyebrow" id="result-eyebrow">Result</div>

    <div class="result-score" id="result-score">0 / 21</div>
    <div class="result-sub" id="result-sub"></div>

      <button class="btn btn-primary" id="retry-btn">다시 풀기</button>
    </div>
  </div>

</div>

const ROLE_SHORT = {sub:"주격", pos:"소유격", obj:"목적격", poss:"소유대명사"};
const PERSONS = ["I","You","He","She","It","We","They"];
const PERSON_FORMS = {
  sub:  {I:"I",    You:"you",  He:"he",  She:"she",  It:"it",  We:"we",  They:"they"},
  pos:  {I:"my",   You:"your", He:"his", She:"her",  It:"its", We:"our", They:"their"},
  obj:  {I:"me",   You:"you",  He:"him", She:"her",  It:"it",  We:"us",  They:"them"},
  poss: {I:"mine", You:"yours",He:"his", She:"hers", It:"its", We:"ours",They:"theirs"}
};
const KO_FORMS = {
  I:    {sub:"나는",   pos:"나의",   obj:"나를",   poss:"나의 것"},
  You:  {sub:"너는",   pos:"너의",   obj:"너를",   poss:"너의 것"},
  He:   {sub:"그는",   pos:"그의",   obj:"그를",   poss:"그의 것"},
  She:  {sub:"그녀는", pos:"그녀의", obj:"그녀를", poss:"그녀의 것"},
  It:   {sub:"그것은", pos:"그것의", obj:"그것을", poss:"그것의 것"},
  We:   {sub:"우리는", pos:"우리의", obj:"우리를", poss:"우리의 것"},
  They: {sub:"그들은", pos:"그들의", obj:"그들을", poss:"그들의 것"}
};

function capFirst(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function formFor(role, person, sentenceInitial){
  const base = PERSON_FORMS[role][person];
  return sentenceInitial ? capFirst(base) : base;
}

// ---------- text-to-speech ----------
let ttsVoices = [];
function loadVoices(){ ttsVoices = speechSynthesis.getVoices(); }
if('speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}
function speakWord(text){
  return new Promise(resolve => {
    if(!('speechSynthesis' in window)){ resolve(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    const enVoice = ttsVoices.find(v => v.lang && v.lang.startsWith('en'));
    if(enVoice) u.voice = enVoice;
    u.rate = 0.85;
    let done = false;
    const finish = () => { if(!done){ done = true; resolve(); } };
    u.onend = finish;
    u.onerror = finish;
    speechSynthesis.speak(u);
    setTimeout(finish, 1800); // fallback in case onend never fires
  });
}
function delay(ms){ return new Promise(r => setTimeout(r, ms)); }

let isPlayingPerson = false;
async function playPerson(person){
  if(isPlayingPerson) return;
  isPlayingPerson = true;
  const card = document.querySelector('.study-card[data-person="'+person+'"]');
  const roles = ['sub','pos','obj','poss'];
  for(const role of roles){
    const cell = card.querySelector('.sf-cell[data-role="'+role+'"]');
    document.querySelectorAll('.sf-cell.playing').forEach(c => c.classList.remove('playing'));
    cell.classList.add('playing');
    const word = formFor(role, person, false);
    await speakWord(word);
    await delay(150);
  }
  document.querySelectorAll('.sf-cell.playing').forEach(c => c.classList.remove('playing'));
  isPlayingPerson = false;
}

let allQuestions = [];
RAW.forEach(([setName, items]) => {
  items.forEach(([role, en, answer, ko]) => {
    allQuestions.push({setName, role, en, answer, ko});
  });
});

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// ---------- persistent state ----------
const STORAGE_KEY = 'pronounSentenceApp_v2';
let state = null;
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state = raw ? JSON.parse(raw) : null;
  }catch(e){ state = null; }
  if(!state){
    state = { studyDone:false, scores:{}, wrongBank:[], spellBatches:null };
  }
  if(!state.spellBatches){
    const ids = shuffle(allQuestions.map((_,i)=>i));
    state.spellBatches = [ids.slice(0,21), ids.slice(21,42), ids.slice(42,63), ids.slice(63,84)];
    saveState();
  }
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function addToWrongBank(id){
  if(state.wrongBank.indexOf(id) === -1){
    state.wrongBank.push(id);
    saveState();
  }
}

const PART_CONFIG = {
  sub:   {title:'주격 선택하기',      subtitle:'문장에 맞는 주격 고르기',   mode:'select', role:'sub',  total:21, colorClass:'c-sub'},
  pos:   {title:'소유격 선택하기',    subtitle:'문장에 맞는 소유격 고르기', mode:'select', role:'pos',  total:21, colorClass:'c-pos'},
  obj:   {title:'목적격 선택하기',    subtitle:'문장에 맞는 목적격 고르기', mode:'select', role:'obj',  total:21, colorClass:'c-obj'},
  poss:  {title:'소유대명사 선택하기', subtitle:'문장에 맞는 소유대명사 고르기', mode:'select', role:'poss', total:21, colorClass:'c-poss'},
  spell1:{title:'스펠링 입력 · 세트 1', subtitle:'네 가지 격이 섞여 나와요', mode:'spell', batchIndex:0, total:21, colorClass:'c-spell'},
  spell2:{title:'스펠링 입력 · 세트 2', subtitle:'네 가지 격이 섞여 나와요', mode:'spell', batchIndex:1, total:21, colorClass:'c-spell'},
  spell3:{title:'스펠링 입력 · 세트 3', subtitle:'네 가지 격이 섞여 나와요', mode:'spell', batchIndex:2, total:21, colorClass:'c-spell'},
  spell4:{title:'스펠링 입력 · 세트 4', subtitle:'네 가지 격이 섞여 나와요', mode:'spell', batchIndex:3, total:21, colorClass:'c-spell'}
};

// ---------- navigation ----------
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome(){
  renderHome();
  showScreen('screen-home');
}
function exitToHome(){
  goHome();
}

function renderHome(){
  const list = document.getElementById('home-list');
  let html = '';

  html += '<div class="section-label">Step 1 · 학습</div>';
  html += partRow('study','c-study','인칭별 격변화표','한눈에 살펴보기', state.studyDone ? '완료 ✓' : '학습하기 →', state.studyDone ? 'done' : '');

  html += '<div class="section-label">Step 2 · 격 선택 연습 (객관식)</div>';
  ['sub','pos','obj','poss'].forEach(key => {
    const cfg = PART_CONFIG[key];
    const s = state.scores[key];
    const badge = s ? (s.correct+' / '+s.total) : '시작 전';
    const cls = s ? (s.correct===s.total ? 'done' : '') : '';
    html += partRow(key, cfg.colorClass, cfg.title, cfg.subtitle, badge, cls);
  });

  html += '<div class="section-label">Step 3 · 스펠링 직접 입력 (랜덤 21개씩)</div>';
  ['spell1','spell2','spell3','spell4'].forEach(key => {
    const cfg = PART_CONFIG[key];
    const s = state.scores[key];
    const badge = s ? (s.correct+' / '+s.total) : '시작 전';
    const cls = s ? (s.correct===s.total ? 'done' : '') : '';
    html += partRow(key, cfg.colorClass, cfg.title, cfg.subtitle, badge, cls);
  });

  html += '<div class="section-label">오답노트</div>';
  const n = state.wrongBank.length;
  html += partRow('review','c-review','틀린 문제만 다시 풀기', '지금까지 모은 오답을 복습해요', n>0 ? (n+'개') : '없음', n>0 ? 'warn' : '');

  list.innerHTML = html;
  document.querySelectorAll('.part-row').forEach(el => {
    el.addEventListener('click', () => handlePartClick(el.dataset.key));
  });
}
function partRow(key, colorClass, title, subtitle, badge, badgeClass){
  return '<div class="part-row '+colorClass+'" data-key="'+key+'">'
    + '<span class="part-dot"></span>'
    + '<div class="part-body"><div class="part-title">'+title+'</div><div class="part-sub">'+subtitle+'</div></div>'
    + '<span class="part-badge '+badgeClass+'">'+badge+'</span>'
    + '</div>';
}
function handlePartClick(key){
  if(key === 'study'){ startStudy(); return; }
  if(key === 'review'){ reviewStart(); return; }
  startPart(key);
}

// ---------- study screen ----------
function startStudy(){
  const list = document.getElementById('study-list');
  let html = '';
  PERSONS.forEach(p => {
    html += '<div class="study-card" data-person="'+p+'"><div class="study-name" onclick="playPerson(\''+p+'\')"><span>'+p+'</span><span class="play-icon">🔊 눌러서 듣기</span></div><div class="study-forms">';
    ['sub','pos','obj','poss'].forEach(role => {
      const w = formFor(role, p, false);
      const k = KO_FORMS[p][role];
      html += '<div class="sf-cell c-'+role+'" data-role="'+role+'"><span class="tag">'+ROLE_SHORT[role]+'</span><span class="w">'+w+'</span><div class="k">'+k+'</div></div>';
    });
    html += '</div></div>';
  });
  list.innerHTML = html;
  showScreen('screen-study');
}
function completeStudy(){
  state.studyDone = true;
  saveState();
  goHome();
}

// ---------- quiz engine ----------
let currentPart = null;
let currentMode = null;
let queue = [];
let current = 0;
let correctCount = 0;
let sessionWrongIds = [];
let answered = false;

function startPart(key){
  const cfg = PART_CONFIG[key];
  let ids;
  if(cfg.role){
    ids = allQuestions.map((q,i)=>i).filter(i => allQuestions[i].role === cfg.role);
  } else {
    ids = state.spellBatches[cfg.batchIndex];
  }
  currentPart = key;
  currentMode = cfg.mode;
  queue = shuffle(ids);
  current = 0;
  correctCount = 0;
  sessionWrongIds = [];
  document.getElementById('part-title-text').textContent = cfg.title;
  showScreen('screen-quiz');
  renderQuestion();
}

function reviewStart(){
  if(state.wrongBank.length === 0) return;
  currentPart = 'review';
  currentMode = 'spell';
  queue = shuffle(state.wrongBank.slice());
  current = 0;
  correctCount = 0;
  sessionWrongIds = [];
  document.getElementById('part-title-text').textContent = '오답노트 복습';
  showScreen('screen-quiz');
  renderQuestion();
}

function buildOptions(q){
  const correctPerson = q.setName;
  const sentenceInitial = q.en.trim().indexOf('___') === 0;
  let others = shuffle(PERSONS.filter(p => p !== correctPerson)).slice(0,3);
  let opts = [correctPerson, ...others].map(p => ({person:p, label: formFor(q.role, p, sentenceInitial)}));
  return shuffle(opts);
}

function renderQuestion(){
  answered = false;
  const id = queue[current];
  const q = allQuestions[id];

  document.getElementById('progress-text').textContent = (current+1)+" / "+queue.length;
  document.getElementById('score-text').textContent = "맞음 "+correctCount;
  document.getElementById('progress-fill').style.width = ((current+1)/queue.length*100)+"%";

  document.getElementById('sent-en').innerHTML = q.en.replace('___', '<span class="blank-slot">____</span>');
  document.getElementById('sent-ko').textContent = q.ko;

  const chip = document.getElementById('role-chip');
  const optionsBox = document.getElementById('options-container');
  const inputRow = document.getElementById('input-row');
  const actionBtn = document.getElementById('action-btn');
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';

  if(currentMode === 'select'){
    inputRow.style.display = 'none';
    optionsBox.style.display = 'flex';
    chip.textContent = ROLE_LABEL[q.role];
    chip.className = 'role-chip show c-'+q.role;

    const opts = buildOptions(q);
    optionsBox.innerHTML = '';
    opts.forEach(opt => {
      const b = document.createElement('button');
      b.className = 'opt-btn';
      b.textContent = opt.label;
      b.dataset.person = opt.person;
      b.onclick = () => selectOption(opt.person, q, id);
      optionsBox.appendChild(b);
    });
    actionBtn.textContent = '다음';
    actionBtn.disabled = true;
  } else {
    optionsBox.style.display = 'none';
    inputRow.style.display = 'flex';
    chip.textContent = '';
    chip.className = 'role-chip';

    const input = document.getElementById('ans-input');
    input.value = '';
    input.className = 'ans-input';
    input.disabled = false;
    setTimeout(()=>input.focus(), 100);

    actionBtn.textContent = '확인';
    actionBtn.disabled = false;
  }
}

function selectOption(person, q, id){
  if(answered) return;
  answered = true;
  const isCorrect = person === q.setName;

  document.querySelectorAll('.opt-btn').forEach(b => {
    b.classList.add('disabled');
    if(b.dataset.person === q.setName) b.classList.add('correct');
    else if(b.dataset.person === person) b.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  if(isCorrect){
    correctCount++;
    fb.textContent = '정답이에요! 👏';
    fb.className = 'feedback good';
  } else {
    fb.textContent = '아쉬워요.';
    fb.className = 'feedback bad';
    sessionWrongIds.push(id);
    addToWrongBank(id);
  }
  document.getElementById('score-text').textContent = "맞음 "+correctCount;
  const actionBtn = document.getElementById('action-btn');
  actionBtn.disabled = false;
  actionBtn.textContent = (current === queue.length-1) ? '결과 보기' : '다음';
}

function handleAction(){
  if(currentMode === 'select'){
    goNext();
    return;
  }
  if(!answered){
    checkSpell();
  } else {
    goNext();
  }
}

function checkSpell(){
  const id = queue[current];
  const q = allQuestions[id];
  const input = document.getElementById('ans-input');
  const userVal = input.value.trim().toLowerCase();
  const correctVal = q.answer.toLowerCase();
  const isCorrect = userVal === correctVal;

  answered = true;
  input.disabled = true;
  input.className = 'ans-input ' + (isCorrect ? 'correct' : 'wrong');

  const chip = document.getElementById('role-chip');
  chip.textContent = ROLE_LABEL[q.role];
  chip.className = 'role-chip show c-'+q.role;

  const fb = document.getElementById('feedback');
  if(isCorrect){
    correctCount++;
    fb.textContent = '정답이에요! 👏';
    fb.className = 'feedback good';
    if(currentPart === 'review'){
      const idx = state.wrongBank.indexOf(id);
      if(idx !== -1){ state.wrongBank.splice(idx,1); saveState(); }
    }
  } else {
    fb.innerHTML = '아쉬워요. 정답은 <b>'+q.answer+'</b> 이에요.';
    fb.className = 'feedback bad';
    sessionWrongIds.push(id);
    addToWrongBank(id);
  }
  document.getElementById('score-text').textContent = "맞음 "+correctCount;
  document.getElementById('action-btn').textContent = (current === queue.length-1) ? '결과 보기' : '다음';
}

function goNext(){
  if(current === queue.length-1){
    finishPart();
    return;
  }
  current++;
  renderQuestion();
}

function finishPart(){
  if(currentPart !== 'review'){
    state.scores[currentPart] = {correct:correctCount, total:queue.length};
    saveState();
  }
  showPartResults();
}

function showPartResults(){
  showScreen('screen-results');
  const isReview = currentPart === 'review';
  const cfg = isReview ? null : PART_CONFIG[currentPart];
  document.getElementById('result-eyebrow').textContent = isReview ? 'Review' : 'Result';
  document.getElementById('result-score').textContent = correctCount+" / "+queue.length;
  const pct = Math.round(correctCount/queue.length*100);
  document.getElementById('result-title').textContent = pct === 100 ? '완벽해요! 🎉' : '수고했어요';
  document.getElementById('result-sub').textContent = (isReview ? '오답노트 · ' : (cfg.title+' · ')) + pct+'% 정답률';

  const list = document.getElementById('wrong-list');
  list.innerHTML = '';
  if(sessionWrongIds.length === 0){
    list.innerHTML = '<div class="empty-note">틀린 문제가 없어요. 완벽해요!</div>';
  } else {
    sessionWrongIds.forEach(id => {
      const q = allQuestions[id];
      const div = document.createElement('div');
      div.className = 'wrong-item c-'+q.role;
      const filledEn = q.en.replace('___', '<b>'+q.answer+'</b>');
      div.innerHTML = '<span class="role-tag">'+ROLE_LABEL[q.role]+'</span>'
        + '<div class="sent">'+filledEn+'</div>'
        + '<div class="sent-ko">'+q.ko+'</div>';
      list.appendChild(div);
    });
  }

  const retryBtn = document.getElementById('retry-btn');
  retryBtn.textContent = isReview ? '오답노트 다시 풀기' : '이 파트 다시 풀기';
  retryBtn.onclick = isReview ? reviewStart : () => startPart(currentPart);
}

document.getElementById('ans-input').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    e.preventDefault();
    handleAction();
  }
});

// ---------- init ----------
loadState();
goHome();
</script>
